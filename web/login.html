<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Endora Playout Login</title>
<style>
  :root { --bg:#0c0d0f; --panel:#1a1c1f; --line:#33363b; --text:#e9eaec; --dim:#8d9299; }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--bg); color:var(--text); font:16px "Segoe UI", system-ui, sans-serif; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:24px; width:min(340px, calc(100vw - 32px)); box-sizing:border-box; }
  h1 { margin:0 0 4px; font-size:24px; }
  p { color:var(--dim); margin:0 0 16px; font-size:14px; }
  input, button { width:100%; box-sizing:border-box; font:inherit; padding:12px; border-radius:6px; }
  input { background:#0b0c0e; color:var(--text); border:1px solid var(--line); }
  button { margin-top:12px; border:0; background:#2462c9; color:#fff; font-weight:700; }
  #err { color:#ff8a1c; min-height:20px; margin-top:10px; font-size:14px; }
</style>
</head>
<body>
<form id="f">
  <h1><img src="/img/logo-playout.png" alt="Endora Playout" style="width:100%; display:block"></h1>
  <p id="hint">Remote control password</p>
  <input id="user" placeholder="Name" autocomplete="username" style="display:none; margin-bottom:10px">
  <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus>
  <button>Log in</button>
  <div id="err"></div>
</form>
<script>
fetch('/api/login_info').then(r => r.json()).then(i => {
  if (i.users) { document.getElementById('user').style.display = ''; document.getElementById('hint').textContent = 'Log in'; document.getElementById('user').focus(); }
});
document.getElementById('f').onsubmit = async e => {
  e.preventDefault();
  const r = await fetch('/api/login', {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({user:document.getElementById('user').value, password:document.getElementById('pw').value})});
  if (r.ok) {
    const local = ['127.0.0.1', 'localhost'].includes(location.hostname);
    const next = new URLSearchParams(location.search).get('next') || (local ? '/' : '/remote');
    location.href = next.startsWith('/') && !next.startsWith('//') ? next : '/remote';
  } else document.getElementById('err').textContent = (await r.json().catch(() => ({}))).error || 'Wrong password';
};
</script>
</body>
</html>
