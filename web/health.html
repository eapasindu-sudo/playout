<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0d0f">
<title>Stream Health - Endora Playout</title>
<style>
  :root { --bg:#0c0d0f; --panel:#1a1c1f; --line:#33363b; --text:#e9eaec; --dim:#8d9299;
          --ok:#2fbf3a; --warn:#e8c21e; --bad:#e0261b; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.35 "Segoe UI", system-ui, sans-serif; padding:10px 16px 40px; }
  .top { display:flex; align-items:center; gap:10px; }
  .top a { margin-left:auto; color:var(--dim); font-size:13px; }
  .big { margin-top:12px; padding:16px; border-radius:8px; font:800 22px "Segoe UI", sans-serif; text-align:center; }
  .big.ok { background:var(--ok); color:#04140a; } .big.warn { background:var(--warn); color:#000; } .big.bad { background:var(--bad); color:#fff; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:6px; margin-top:10px; }
  .row { display:flex; gap:10px; padding:10px; border-top:1px solid #26292d; align-items:flex-start; }
  .row:first-child { border-top:0; }
  .dot { flex:none; width:12px; height:12px; border-radius:50%; margin-top:4px; background:var(--ok); }
  .dot.warn { background:var(--warn); } .dot.bad { background:var(--bad); }
  .n { font-weight:700; } .t { color:var(--dim); font-size:14px; word-break:break-word; }
  .meter { height:6px; background:#050506; border-radius:3px; margin-top:6px; overflow:hidden; }
  .meter div { height:100%; background:var(--ok); }
  .meter.warn div { background:var(--warn); } .meter.bad div { background:var(--bad); }
  .foot { color:var(--dim); font-size:12px; margin-top:10px; }
</style>
</head>
<body>
<div class="top"><img src="/img/logo-playout.png" alt="Endora Playout" style="height:30px"><b id="st">Stream Health</b><a href="/remote">Remote &rsaquo;</a></div>
<div class="big ok" id="big">...</div>
<div class="card" id="list"></div>
<div class="foot" id="foot">Updates every 2 seconds.</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const WORD = {ok:'ALL OK', warn:'CHECK', bad:'PROBLEM'};
const hms = s => s == null ? '' : `${Math.floor(s / 3600)}:${String(Math.floor(s / 60) % 60).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
let fails = 0;
async function poll() {
  try {
    const r = await fetch('/api/health', {cache:'no-store'});
    if (r.status === 401) { location.href = '/login?next=/health'; return; }
    const h = await r.json(); fails = 0;
    if (h.station) $('st').textContent = h.station;
    $('big').className = 'big ' + h.level;
    $('big').textContent = WORD[h.level] || h.level;
    $('list').innerHTML = h.items.map(i => {
      const meter = i.target ? `<div class="meter ${i.level}"><div style="width:${Math.min(100, Math.round(100 * (i.kbps || 0) / i.target))}%"></div></div>` : '';
      const up = i.uptime ? ` &middot; on air ${hms(i.uptime)}` : '';
      return `<div class="row"><span class="dot ${i.level}"></span><div style="flex:1; min-width:0">
        <div class="n">${esc(i.name)}</div><div class="t">${esc(i.text)}${up}</div>${meter}</div></div>`;
    }).join('');
    $('foot').textContent = 'Updated ' + new Date(h.time * 1000).toLocaleTimeString();
  } catch (e) {
    if (++fails > 2) { $('big').className = 'big bad'; $('big').textContent = 'NO CONNECTION TO PLAYOUT'; }
  }
}
poll(); setInterval(poll, 2000);
</script>
</body>
</html>
