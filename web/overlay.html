<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CG Composer output</title>
<!-- The Live output of CG Composer as a see-through page: an OBS / vMix Browser Source (1920 x 1080),
     the full-screen output window (?bg=#000000) and the Live monitor (?bg=checker).
     The layer pictures come from Composer; this page moves them (fade, slide, wipe, scale) at the screen's rate. -->
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:transparent; }
  #wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #st { position:relative; transform-origin:0 0; overflow:hidden; }
  #st img { position:absolute; left:0; top:0; transform-origin:50% 50%; will-change:transform, opacity; }
  body.nocur, body.nocur * { cursor:none; }
  #msg { position:absolute; left:8px; bottom:6px; font:11px system-ui, sans-serif; color:#ff6b5f; text-shadow:0 1px 2px #000; }
</style>
</head>
<body>
<div id="wrap"><div id="st"></div></div>
<div id="msg"></div>
<script>
const q = new URLSearchParams(location.search);
const bg = q.get('bg') || '';
if (bg === 'checker') document.body.style.background = 'repeating-conic-gradient(#3a3d42 0 25%, #2a2c30 0 50%) 0 0 / 24px 24px';
else if (bg) document.body.style.background = bg;
if (q.get('cursor') === '0') document.body.classList.add('nocur');
const st = document.getElementById('st'), msg = document.getElementById('msg');
let W = 1920, H = 1080, progs = [];       // [{id, phase, t0 (performance ms), pics, in, out, imgs}]

function fit() {
  const k = Math.min(innerWidth / W, innerHeight / H);
  st.style.width = W + 'px'; st.style.height = H + 'px';
  st.style.transform = `scale(${k})`;
  st.parentElement.style.justifyContent = 'flex-start'; st.parentElement.style.alignItems = 'flex-start';
  st.style.marginLeft = (innerWidth - W * k) / 2 + 'px'; st.style.marginTop = (innerHeight - H * k) / 2 + 'px';
}
addEventListener('resize', fit);

function apply(s) {
  const now = performance.now();
  if (s.w !== W || s.h !== H) { W = s.w; H = s.h; fit(); }
  const keep = new Set(s.progs.map(p => p.id));
  for (const p of progs) if (!keep.has(p.id)) p.imgs.forEach(i => i.remove());
  const old = new Map(progs.map(p => [p.id, p]));
  progs = s.progs.map(sp => {
    let p = old.get(sp.id);
    if (!p) {
      p = {id: sp.id, pics: sp.pics, imgs: sp.pics.map((_, i) => {
        const im = new Image(); im.src = `/api/live/layer/${sp.id}/${i}.png`; im.style.opacity = 0; st.appendChild(im); return im; })};
    }
    p.phase = sp.phase; p.t0 = now - sp.t * 1000; p.in = sp.in; p.out = sp.out;
    return p;
  });
  // newest on top
  for (const p of progs) p.imgs.forEach(i => st.appendChild(i));
}

const ease = p => 1 - Math.pow(1 - p, 3);
const len = an => Math.max(0, ...an.filter(a => a[0] !== 'none').map(a => a[1] + a[2]));

function frame() {
  const now = performance.now();
  for (const p of progs) {
    let t = (now - p.t0) / 1000;
    if (p.phase === 'in' && t >= len(p.in)) { p.phase = 'on'; p.t0 = now; t = 0; }
    if (p.phase === 'out' && t >= len(p.out)) p.phase = 'gone';
    const lo = len(p.out);
    p.pics.forEach(([x, y, w, h], i) => {
      const im = p.imgs[i];
      let a = 1, sc = 1, cl = 0, cr = 0, dx = 0, dy = 0, show = true;
      const [kind, delay, dur] = (p.phase === 'out' ? p.out : p.in)[i];
      if (p.phase === 'gone') show = false;
      else if (p.phase === 'on' || kind === 'none') show = p.phase !== 'out' || t < lo;
      else {
        const qq = dur <= 0 ? 1 : Math.min(1, Math.max(0, (t - delay) / dur));
        const pp = p.phase === 'in' ? qq : 1 - qq;
        if (pp <= 0) show = false;
        const e = p.phase === 'in' ? ease(pp) : 1 - ease(1 - pp);
        if (kind === 'fade') a = e;
        else if (kind.startsWith('slide')) {
          const sx = Math.max(60, Math.min(500, w * 0.6)), sy = Math.max(40, Math.min(300, h * 0.8));
          const d = {'slide-l': [-sx, 0], 'slide-r': [sx, 0], 'slide-u': [0, sy], 'slide-d': [0, -sy]}[kind];
          dx = d[0] * (1 - e); dy = d[1] * (1 - e); a = Math.min(1, e * 1.6);
        } else if (kind === 'wipe-l') cr = 1 - e;
        else if (kind === 'wipe-r') cl = 1 - e;
        else if (kind === 'scale') { sc = 0.6 + 0.4 * e; a = e; }
        else if (kind === 'pop') { sc = e < 0.85 ? 0.5 + 0.62 * e : 1.027 - 0.18 * (e - 0.85); a = Math.min(1, e * 2); }
      }
      if (!show || !im.complete) { im.style.opacity = 0; return; }
      im.style.opacity = a;
      im.style.transform = `translate(${x + dx}px, ${y + dy}px) scale(${sc})`;
      im.style.clipPath = (cl || cr) ? `inset(0 ${cr * 100}% 0 ${cl * 100}%)` : '';
    });
  }
  requestAnimationFrame(frame);
}

function connect() {
  const es = new EventSource('/api/live/stream');
  es.onmessage = e => { msg.textContent = ''; apply(JSON.parse(e.data)); };
  es.onerror = () => { msg.textContent = 'CG Composer is not answering. Trying again...'; };
}
fit();
fetch('/api/live/overlay').then(r => r.json()).then(apply).catch(() => {}).finally(connect);
requestAnimationFrame(frame);
</script>
</body>
</html>
