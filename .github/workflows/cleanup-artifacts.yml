name: Clean old build artifacts

# Actions storage is small on the free plan. Every build uploads the installer as an artifact, and the
# release already keeps it, so artifacts older than a day are deleted (all of them when run by hand).
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Build Playout installer"]
    types: [completed]

permissions:
  actions: write
  contents: write      # old releases

jobs:
  clean:
    runs-on: ubuntu-latest
    steps:
      - name: Delete artifacts older than a day (every artifact when run by hand)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api --paginate "repos/$REPO/actions/artifacts?per_page=100" \
            --jq '.artifacts[] | [.id, .name, .created_at, .size_in_bytes] | @tsv' > all.tsv
          echo "artifacts: $(wc -l < all.tsv)"
          # a branch test build's installer stays a day for testing; the releases keep every main build
          cutoff=$(date -u -d '1 day ago' +%Y-%m-%dT%H:%M:%SZ)
          [ "${{ github.event_name }}" = "workflow_dispatch" ] && cutoff=9999
          awk -F'\t' -v c="$cutoff" '$3 < c' all.tsv > old.tsv
          echo "deleting: $(wc -l < old.tsv) ($(awk -F'\t' '{s+=$4} END {printf "%.0f MB", s/1048576}' old.tsv))"
          while IFS=$'\t' read -r id name created size; do
            gh api -X DELETE "repos/$REPO/actions/artifacts/$id" && echo "deleted $name $created"
          done < old.tsv
      - name: Delete old releases (keep the newest 5, so an older version is still there to go back to)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # only Playout's own vN.N.N releases, newest first; Playout updates itself from the newest one
          gh api --paginate "repos/$REPO/releases?per_page=100" --jq '.[] | select(.draft | not) | [.published_at, .tag_name] | @tsv' \
            | grep -P '\tv\d+\.\d+\.\d+$' | sort -r | tail -n +6 | cut -f2 > old-releases.txt || true
          echo "deleting $(wc -l < old-releases.txt) release(s)"
          while read -r tag; do
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes && echo "deleted $tag"
          done < old-releases.txt
