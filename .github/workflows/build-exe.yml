name: Build Playout.exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        working-directory: build
        run: pyinstaller --noconfirm playout.spec
      - name: Smoke test (imports + NDI runtime load)
        run: |
          python -c "import cyndilib, av, imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
      - name: Smoke test Playout.exe (starts, serves the control screen)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath build/dist/Playout/Playout.exe -WorkingDirectory build/dist/Playout -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://localhost:8080/api/state; if ($r.output) { $ok = $true; break } } catch {}
          }
          Invoke-WebRequest http://localhost:8080/ -UseBasicParsing | Select-Object -ExpandProperty StatusCode
          Stop-Process -Id $p.Id -Force
          Remove-Item build/dist/Playout/config.json, build/dist/Playout/data, build/dist/Playout/logs, build/dist/Playout/media -Recurse -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Playout.exe did not start" }
          "Playout.exe started and answered on port 8080"
      - name: Add folders and readme
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/dist/Playout/media, build/dist/Playout/data, build/dist/Playout/logs | Out-Null
          Copy-Item README.md build/dist/Playout/
          Compress-Archive -Path build/dist/Playout -DestinationPath Playout-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Playout-windows
          path: Playout-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Playout-windows.zip
