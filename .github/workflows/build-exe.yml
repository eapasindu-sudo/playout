name: Build Playout.exe
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build
        working-directory: build
        run: pyinstaller --noconfirm playout.spec
      - name: Smoke test (imports + NDI runtime load)
        run: |
          python -c "import cyndilib, av, imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())"
      - name: Add folders and readme
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/dist/Playout/media, build/dist/Playout/data, build/dist/Playout/logs | Out-Null
          Copy-Item README.md build/dist/Playout/
          Compress-Archive -Path build/dist/Playout -DestinationPath Playout-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Playout-windows
          path: Playout-windows.zip
      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Playout-windows.zip
