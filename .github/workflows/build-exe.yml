name: Build Playout installer
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: FriBiDi (Sinhala / Tamil text shaping in text CGs)
        shell: pwsh
        run: |
          C:\msys64\usr\bin\pacman.exe -Sy --noconfirm --needed mingw-w64-x86_64-fribidi
          New-Item -ItemType Directory -Force build\dlls | Out-Null
          Copy-Item C:\msys64\mingw64\bin\libfribidi-0.dll build\dlls\
          $env:PATH = "$PWD\build\dlls;$env:PATH"
          python -c "from PIL import features; ok = features.check('raqm'); print('raqm', ok); assert ok"
      - name: Set version
        shell: pwsh
        run: |
          "VERSION = '$env:APP_VERSION'" | Set-Content -Path version.py
          Get-Content version.py
      - name: Check the update script (PowerShell syntax)
        shell: pwsh
        run: |
          $errs = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path build\update.ps1), [ref]$null, [ref]$errs) | Out-Null
          if ($errs.Count) { $errs | ForEach-Object { Write-Error $_.ToString() }; exit 1 }
          Write-Host "update script OK"

      - name: Built-in browser for web overlays (cefcg.exe + Chromium Embedded)
        shell: pwsh
        run: |
          # the newest stable CEF "minimal" build for 64-bit Windows
          $idx = Invoke-RestMethod https://cef-builds.spotifycdn.com/index.json
          $v = $idx.windows64.versions | Where-Object channel -eq 'stable' | Select-Object -First 1
          $f = $v.files | Where-Object type -eq 'minimal' | Select-Object -First 1
          "CEF $($v.cef_version) ($($f.name))"
          Invoke-WebRequest "https://cef-builds.spotifycdn.com/$($f.name)" -OutFile "$env:RUNNER_TEMP\cef.tar.bz2"
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\cef" | Out-Null
          tar -xjf "$env:RUNNER_TEMP\cef.tar.bz2" -C "$env:RUNNER_TEMP\cef"
          $root = (Get-ChildItem "$env:RUNNER_TEMP\cef" -Directory | Select-Object -First 1).FullName -replace '\\', '/'
          # FFmpeg 7.x development files (headers, import libraries, DLLs) for the GPU engine's encoders
          $rel = Invoke-RestMethod -Headers @{ Authorization = "Bearer $env:GH_TOKEN" } https://api.github.com/repos/BtbN/FFmpeg-Builds/releases/tags/latest
          $ff = $rel.assets | Where-Object name -match '^ffmpeg-n7\.\d+-latest-win64-gpl-shared-7\.\d+\.zip$' | Sort-Object name -Descending | Select-Object -First 1
          "FFmpeg $($ff.name)"
          Invoke-WebRequest $ff.browser_download_url -OutFile "$env:RUNNER_TEMP\ffmpeg.zip"
          Expand-Archive "$env:RUNNER_TEMP\ffmpeg.zip" "$env:RUNNER_TEMP\ffmpeg"
          $ffroot = (Get-ChildItem "$env:RUNNER_TEMP\ffmpeg" -Directory | Select-Object -First 1).FullName -replace '\\', '/'
          cmake -S cefcg -B cefcg\out -A x64 "-DCEF_ROOT=$root" "-DFFMPEG_ROOT=$ffroot"
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build cefcg\out --config Release --target cefcg
          if ($LASTEXITCODE -ne 0) { throw "cefcg build failed" }
          cmake --build cefcg\out --config Release --target pgpu
          if ($LASTEXITCODE -ne 0) { throw "pgpu (GPU engine) build failed" }
          New-Item -ItemType Directory -Force build\cef | Out-Null
          Copy-Item cefcg\out\Release\* build\cef -Recurse -Force -Exclude *.lib,*.pdb,*.exp,*.ilk
          Copy-Item "$ffroot/bin/*.dll" build\cef -Force
          Get-ChildItem build\cef | Select-Object Name, Length
          if (-not (Test-Path build\cef\cefcg.exe)) { throw "cefcg.exe not built" }
          if (-not (Test-Path build\cef\pgpu.exe)) { throw "pgpu.exe not built" }
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Test the built-in browser (draws a page into a web CG)
        run: python build/test_cefcg.py
      - name: Test the GPU engine (mixing, web page, stream and recording encode)
        run: python build/test_pgpu.py
      - name: Build Playout.exe
        working-directory: build
        run: pyinstaller --noconfirm playout.spec
      - name: Test Playout.exe (starts, serves the control screen)
        shell: pwsh
        env:
          PLAYOUT_HOME: ${{ runner.temp }}\playout-test
        run: |
          $p = Start-Process -FilePath build/dist/Playout/Playout.exe -ArgumentList "--headless" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://localhost:8080/api/state; if ($r.output) { $ok = $true; break } } catch {}
          }
          $f = $null; try { $f = Invoke-RestMethod http://localhost:8080/api/textcg/fonts } catch {}
          "text CG shaping (raqm): $($f.raqm)"
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if ($ok -and -not $f.raqm) { throw "Sinhala text shaping (raqm / fribidi) missing in Playout.exe" }
          Get-Content "$env:PLAYOUT_HOME\logs\playout.log" -ErrorAction SilentlyContinue | Select-Object -Last 20
          if (-not $ok) { throw "Playout.exe did not start" }
          "Playout.exe started and answered on port 8080"
      - name: ATEM Switcher + Sony camera control (latest release of eapasindu-sudo/atem-web-switcher)
        shell: pwsh
        run: |
          # the switcher's own installer carries ATEM-Switcher.exe and the Sony bridge + Sony SDK runtime files;
          # they go into Playout's installer as {app}\atem (Functions > ATEM & Cameras)
          Invoke-WebRequest https://github.com/eapasindu-sudo/atem-web-switcher/raw/main/download/ATEM-Switcher-Setup.exe -OutFile "$env:RUNNER_TEMP\atem-setup.exe"
          & "$env:ProgramFiles\7-Zip\7z.exe" x -y "-obuild\atem" "$env:RUNNER_TEMP\atem-setup.exe" ATEM-Switcher.exe sony | Out-Null
          if (-not (Test-Path build\atem\ATEM-Switcher.exe)) { throw "ATEM-Switcher.exe not found in the ATEM Switcher installer" }
          Get-ChildItem build\atem -Recurse -File | Select-Object FullName, Length
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" build\installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Get-Item build\output\Playout-Setup.exe | Select-Object Name, Length
      - name: Test installer (silent install, start, uninstall)
        shell: pwsh
        run: |
          Start-Process build\output\Playout-Setup.exe -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART" -Wait
          $exe = "$env:ProgramFiles\Playout\Playout.exe"
          if (-not (Test-Path $exe)) { throw "Playout.exe not installed" }
          $p = Start-Process -FilePath $exe -ArgumentList "--headless" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            Start-Sleep -Seconds 2
            try { $r = Invoke-RestMethod http://localhost:8080/api/state; if ($r.output) { $ok = $true; break } } catch {}
          }
          # Functions > ATEM & Cameras: the bundled ATEM Switcher starts and answers on port 3000
          $atem = $null
          if ($ok) {
            try { Invoke-RestMethod -Method Post http://localhost:8080/api/atem/open -ContentType application/json -Body '{"browser":true}' | Out-Null } catch {}
            for ($i = 0; $i -lt 15; $i++) { Start-Sleep -Seconds 1; try { $atem = Invoke-RestMethod http://localhost:8080/api/atem; if ($atem.linked) { break } } catch {} }
            "ATEM Switcher: installed=$($atem.installed) running=$($atem.running) linked=$($atem.linked)"
          }
          Get-Process ATEM-Switcher, sony-bridge -ErrorAction SilentlyContinue | Stop-Process -Force
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Installed Playout.exe did not start" }
          if (-not ($atem -and $atem.linked)) { throw "The ATEM Switcher that comes with Playout did not start" }
          # update the installed Playout the way the Update button does (update.ps1 + request file)
          if (-not (Test-Path "$env:ProgramFiles\Playout\update.ps1")) { throw "update.ps1 not installed" }
          Copy-Item build\output\Playout-Setup.exe "$env:TEMP\Playout-Setup-9.9.9.exe"
          Remove-Item "$env:TEMP\endora-update-result.txt" -ErrorAction SilentlyContinue
          @{ setup = "$env:TEMP\Playout-Setup-9.9.9.exe"; pid = 999999; version = "9.9.9" } | ConvertTo-Json | Set-Content "$env:TEMP\endora-update-request.json"
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "$env:ProgramFiles\Playout\update.ps1"
          $res = (Get-Content "$env:TEMP\endora-update-result.txt" -Raw).Trim()
          "update result: $res"
          Get-Content "$env:TEMP\endora-update-setup.log" -Tail 5 -ErrorAction SilentlyContinue
          if ($res -ne "0 9.9.9") { throw "Update did not install: $res" }
          Get-Process Playout -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Start-Process "$env:ProgramFiles\Playout\unins000.exe" -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES" -Wait
          "Installer OK: installed, started, uninstalled"
      - uses: actions/upload-artifact@v4
        with:
          name: Playout-Setup
          path: build/output/Playout-Setup.exe
      - name: Publish release (Playout updates itself from here)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $msg = git log -1 --pretty=%s
          gh release create "v$env:APP_VERSION" build/output/Playout-Setup.exe --title "Playout $env:APP_VERSION" --notes "$msg" --target $env:GITHUB_SHA
